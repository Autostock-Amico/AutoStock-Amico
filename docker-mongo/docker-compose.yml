services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_inventory
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-santi}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-santi123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-inventory_db}
    volumes:
      - mongo_data:/data/db

  backend-express:
    build:
      context: ../backend-express
      dockerfile: Dockerfile
    container_name: express_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-santi}:${MONGO_INITDB_ROOT_PASSWORD:-santi123}@mongodb:27017/${MONGO_INITDB_DATABASE:-inventory_db}?authSource=admin
    depends_on:
      - mongodb

  backend-fastapi:
    build:
      context: ../backend-fastapi
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-santi}:${MONGO_INITDB_ROOT_PASSWORD:-santi123}@mongodb:27017/${MONGO_INITDB_DATABASE:-inventory_db}?authSource=admin
    depends_on:
      - mongodb

volumes:
  mongo_data:
